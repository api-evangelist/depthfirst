aid: depthfirst
name: depthfirst
description: 'depthfirst is an applied AI lab building an autonomous application security
  platform that protects software from design through production. Its General Security
  Intelligence platform builds context across a company''s code, infrastructure, and
  business logic to detect complex vulnerabilities, cut false positives, and generate
  merge-ready fixes. Product surfaces include a code scanner, dependency firewall,
  secrets detection, supply-chain mapping, and agentic pentesting, alongside in-house
  security models such as dfs-mini1. Backed by Accel, Meritech Capital, Forerunner
  Ventures, and The House Fund, depthfirst works with companies including ClickUp,
  Lovable, Supabase, incident.io, and Moveworks.'
